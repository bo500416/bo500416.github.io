name: Deploy Hugo

on:
  push:
    branches:
      - master

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.88.0'

      - name: Build
        run: hugo

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.personal_token }}
          PUBLISH_BRANCH: gh-pages
          PUBLISH_DIR: ./public
          commit_message: ${{ github.event.head_commit.message }}
      
      - name: Deploy to FTP (虚拟空间)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4  # FTP上传的Action
        with:
          server: us2.panel.net.cn        # FTP服务器地址（如：ftp.example.com）
          username: s2564719     # FTP用户名
          password: hengbo2960798     # FTP密码
          local-dir: ./public/                      # 本地要上传的目录（Hugo构建结果）
          server-dir: /wwwroot/                        # 服务器目标目录（根据虚拟空间需求修改）
          # 可选配置：删除服务器上不存在的文件（保持与本地一致）
          delete-remote: true
